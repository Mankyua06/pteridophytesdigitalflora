name: Local-data-independent checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check scripts tests
      - run: uv run python -m scripts.validate --stage public
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: cd web && npx playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
