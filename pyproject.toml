[project]
name = "fern-digital-flora"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.5,<4", "pillow>=11.3,<13", "pyyaml>=6.0.2,<7", "supabase>=2.18,<3", "python-dotenv>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
